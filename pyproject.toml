[project]
name = "household-chores"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "household_chores.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
